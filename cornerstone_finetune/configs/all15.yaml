# Ablation -- one channel per raw label id, nothing unioned.
#
# This is the literal transcription of labels.json and it is the *weakest* of
# the three: `classLiver` here is parenchyma with vessel-shaped holes in it,
# `classVenaPorta` is the trunk without its pedicles, and the nine mesh classes
# carry the damage described in README Sec. 2. Useful to quantify what the
# grouping in core6 buys; not the config to deploy.
seed: 42
run_name: all15
run_root: ./runs/cornerstone
monitor: val/dice_bulk
monitor_mode: max
save_top_k: 3
checkpoint_every_minutes: 30
freeze_encoder_epochs: 3
early_stopping_patience: 0
log_slices_every_n_epochs: 10

data:
  channel_preset: all15
  roi_size: [96, 96, 96]
  intensity_range: [-175.0, 250.0]
  batch_size: 1
  samples_per_volume: 4
  num_workers: 4
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  exclude_modality: [MR]
  group_by: case
  crop_thin_share: 0.8
  cache_rate_train: 1.0
  cache_rate_val: 1.0

model:
  feature_size: 36
  pretrained_weights: data/nn_model_weights/swin_unetr-epoch=483-val_loss=0.07.ckpt
  use_checkpoint: true
  init_bias_prior: true
  learning_rate: 3.0e-4
  encoder_lr_scale: 0.3
  warmup_epochs: 2

trainer:
  max_epochs: 300
  precision: bf16-mixed
