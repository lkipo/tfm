# Stage 1e -- the Couinaud-minimal channel set (8 channels).
#
# Everything the Couinaud pipeline consumes, each class separate: liver, vena
# porta (bifurcation anchor), ivc, aorta (frame), and the four portal pedicles
# (the sectors). Deliberately NOT trained: gallbladder (soft frame evidence
# only), hepatic veins (used for the independent validation, which degrades
# gracefully without them), and the portal_tree/vessels unions (redundant once
# the individual classes exist). The pedicles are remnants in the masks
# (classBloodVessels overwrite, labels.py) and are masked per subject where
# absent. Everything else identical to core5_paper_cldice.yaml -- paper
# backbone, lambda_cldice 0.8.
seed: 42
run_name: couinaud8_paper_cldice
run_root: ./runs/cornerstone
monitor: val/dice_thin
monitor_mode: max
save_top_k: 3
checkpoint_every_minutes: 30
freeze_encoder_epochs: 3
early_stopping_patience: 0
log_slices_every_n_epochs: 5

data:
  channel_preset: couinaud8
  roi_size: [96, 96, 96]
  intensity_range: [-175.0, 250.0]
  batch_size: 1
  samples_per_volume: 4
  num_workers: 4
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
  n_folds: 0
  fold: 0
  exclude_modality: [MR]
  group_by: case
  crop_background_ratio: 0.05
  crop_thin_share: 0.7
  elastic_prob: 0.15
  affine_prob: 0.3
  cache_rate_train: 1.0
  cache_rate_val: 1.0

model:
  feature_size: 36
  pretrained_weights: LightningMedSeg3D/weights/BTCV/swin_unetr.pth
  sw_batch_size: 4
  sw_overlap: 0.5
  use_checkpoint: true
  init_bias_prior: true
  pos_weight_cap: 50.0
  lambda_dice: 1.0
  lambda_bce: 1.0
  lambda_cldice: 0.8
  learning_rate: 3.0e-4
  weight_decay: 0.01
  encoder_lr_scale: 0.3
  warmup_epochs: 2
  scheduler: cosine
  threshold: 0.5
